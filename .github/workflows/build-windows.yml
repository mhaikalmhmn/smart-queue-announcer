name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller `
            --name SmartQueueAnnouncer `
            --windowed `
            --noconfirm `
            --clean `
            --add-data "sounds;sounds" `
            --add-data "voice_cache;voice_cache" `
            app/main.py

      - name: Arrange external resources
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist/SmartQueueAnnouncer/sounds"
          New-Item -ItemType Directory -Force -Path "dist/SmartQueueAnnouncer/voice_cache"

          Copy-Item -Path "sounds\*" `
            -Destination "dist/SmartQueueAnnouncer\sounds" `
            -Recurse -Force

          Copy-Item -Path "voice_cache\*" `
            -Destination "dist/SmartQueueAnnouncer\voice_cache" `
            -Recurse -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: SmartQueueAnnouncer-Windows
          path: dist/SmartQueueAnnouncer/
